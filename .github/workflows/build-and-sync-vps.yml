name: Build Mobile Apps (APK & IPA) and Sync to VPS

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Environment target (production, staging, development)'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
          - development
      api_url:
        description: 'Express API URL (optional override, e.g. https://api.yourdomain.com)'
        required: false
        default: ''
      pocketbase_url:
        description: 'PocketBase URL (optional override, e.g. https://pb.yourdomain.com)'
        required: false
        default: ''
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - '.github/workflows/ci-cd-web-vps.yml'

jobs:
  # ==========================================
  # 1. BUILD ANDROID (.APK) - RUN ON UBUNTU
  # ==========================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        env:
          VITE_API_BASE_URL: ${{ inputs.api_url || secrets.VITE_API_BASE_URL }}
          VITE_POCKETBASE_URL: ${{ inputs.pocketbase_url || secrets.VITE_POCKETBASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${VITE_POCKETBASE_URL:-}" ]; then
            echo "::warning::VITE_POCKETBASE_URL not set in secrets! Android APK will use build fallback."
          fi
          npm run typecheck
          npm run build

      - name: Sync to Capacitor Android
        run: npx cap sync android

      - name: Build Android APK (Debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK File
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk app-latest.apk

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-latest-android-apk
          path: app-latest.apk
          retention-days: 14

      - name: Transfer APK to VPS via Verified SSH & SCP
        if: ${{ env.VPS_HOST != '' && env.VPS_SSH_KEY != '' }}
        env:
          VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USERNAME || secrets.VPS_USERNAME || 'ubuntu' }}
          VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ vars.VPS_SSH_PORT || secrets.VPS_SSH_PORT || vars.VPS_PORT || secrets.VPS_PORT || 22 }}
          VPS_KNOWN_HOSTS: ${{ vars.VPS_SSH_KNOWN_HOSTS || secrets.VPS_SSH_KNOWN_HOSTS }}
          VPS_TARGET: ${{ vars.VPS_TARGET_DIR || secrets.VPS_TARGET_DIR || '/srv/www/life-planner/downloads' }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$VPS_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          if [ -n "${VPS_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
            chmod 600 "$HOME/.ssh/known_hosts"
            STRICT_OPT="-o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          else
            STRICT_OPT="-o StrictHostKeyChecking=no"
          fi

          # 1. Pastikan direktori tujuan di VPS sudah ada dan dapat ditulisi
          echo "Memeriksa dan membuat direktori target di VPS: $VPS_TARGET"
          ssh -o BatchMode=yes $STRICT_OPT -p "$VPS_PORT" -i "$HOME/.ssh/id_ed25519" "$VPS_USER@$VPS_HOST" \
            "mkdir -p '$VPS_TARGET' 2>/dev/null || (sudo mkdir -p '$VPS_TARGET' && sudo chown -R $VPS_USER:$VPS_USER '$VPS_TARGET' && chmod 755 '$VPS_TARGET')"

          # 2. Upload APK via SCP
          echo "Mentransfer app-latest.apk ke VPS..."
          scp -o BatchMode=yes $STRICT_OPT -P "$VPS_PORT" -i "$HOME/.ssh/id_ed25519" app-latest.apk "$VPS_USER@$VPS_HOST:$VPS_TARGET/app-latest.apk"

          # 3. Pastikan izin akses file agar dapat diunduh melalui web server (Caddy/Nginx)
          ssh -o BatchMode=yes $STRICT_OPT -p "$VPS_PORT" -i "$HOME/.ssh/id_ed25519" "$VPS_USER@$VPS_HOST" \
            "chmod 644 '$VPS_TARGET/app-latest.apk'"

          rm -f "$HOME/.ssh/id_ed25519"
          echo "✓ Android APK berhasil ditransfer ke $VPS_TARGET/app-latest.apk"

  # ==========================================
  # 2. BUILD IOS (.IPA) - RUN ON MACOS CLOUD
  # ==========================================
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        env:
          VITE_API_BASE_URL: ${{ inputs.api_url || secrets.VITE_API_BASE_URL }}
          VITE_POCKETBASE_URL: ${{ inputs.pocketbase_url || secrets.VITE_POCKETBASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${VITE_POCKETBASE_URL:-}" ]; then
            echo "::warning::VITE_POCKETBASE_URL not set in secrets! iOS IPA will use build fallback."
          fi
          npm run typecheck
          npm run build

      - name: Sync to Capacitor iOS
        run: npx cap sync ios

      - name: Build iOS Archive (Unsigned)
        run: |
          mkdir -p build
          if [ -d "ios/App/App.xcworkspace" ]; then
            TARGET_FLAG="-workspace ios/App/App.xcworkspace"
          else
            TARGET_FLAG="-project ios/App/App.xcodeproj"
          fi
          xcodebuild $TARGET_FLAG \
                     -scheme App \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -archivePath build/App.xcarchive \
                     archive \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY=""

      - name: Package .xcarchive into .ipa
        run: |
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -r ../app-latest.ipa Payload

      - name: Upload IPA to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-latest-ios-ipa
          path: app-latest.ipa
          retention-days: 14

      - name: Transfer IPA to VPS via SCP
        if: ${{ env.VPS_HOST != '' && env.VPS_SSH_KEY != '' }}
        env:
          VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USERNAME || secrets.VPS_USERNAME || 'ubuntu' }}
          VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ vars.VPS_SSH_PORT || secrets.VPS_SSH_PORT || vars.VPS_PORT || secrets.VPS_PORT || 22 }}
          VPS_KNOWN_HOSTS: ${{ vars.VPS_SSH_KNOWN_HOSTS || secrets.VPS_SSH_KNOWN_HOSTS }}
          VPS_TARGET: ${{ vars.VPS_TARGET_DIR || secrets.VPS_TARGET_DIR || '/srv/www/life-planner/downloads' }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$VPS_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          if [ -n "${VPS_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
            chmod 600 "$HOME/.ssh/known_hosts"
            STRICT_OPT="-o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          else
            STRICT_OPT="-o StrictHostKeyChecking=no"
          fi
          # 1. Pastikan direktori tujuan di VPS sudah ada dan dapat ditulisi
          echo "Memeriksa dan membuat direktori target di VPS: $VPS_TARGET"
          ssh -o BatchMode=yes $STRICT_OPT -p "$VPS_PORT" -i "$HOME/.ssh/id_ed25519" "$VPS_USER@$VPS_HOST" \
            "mkdir -p '$VPS_TARGET' 2>/dev/null || (sudo mkdir -p '$VPS_TARGET' && sudo chown -R $VPS_USER:$VPS_USER '$VPS_TARGET' && chmod 755 '$VPS_TARGET')"

          # 2. Upload IPA via SCP
          echo "Mentransfer app-latest.ipa ke VPS..."
          scp -o BatchMode=yes $STRICT_OPT -P "$VPS_PORT" -i "$HOME/.ssh/id_ed25519" app-latest.ipa "$VPS_USER@$VPS_HOST:$VPS_TARGET/app-latest.ipa"

          # 3. Pastikan izin akses file agar dapat diunduh melalui web server
          ssh -o BatchMode=yes $STRICT_OPT -p "$VPS_PORT" -i "$HOME/.ssh/id_ed25519" "$VPS_USER@$VPS_HOST" \
            "chmod 644 '$VPS_TARGET/app-latest.ipa'"

          rm -f "$HOME/.ssh/id_ed25519"
          echo "✓ iOS IPA berhasil ditransfer ke $VPS_TARGET/app-latest.ipa"
