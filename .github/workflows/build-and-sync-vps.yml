name: Build Mobile Apps (APK & IPA) and Sync to VPS

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Environment target (production, staging, development)'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
          - development
      api_url:
        description: 'Express API URL (optional override, e.g. https://api.yourdomain.com)'
        required: false
        default: ''
      pocketbase_url:
        description: 'PocketBase URL (optional override, e.g. https://pb.yourdomain.com)'
        required: false
        default: ''
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - '.github/workflows/ci-cd-web-vps.yml'

jobs:
  # ==========================================
  # 1. BUILD ANDROID (.APK) - RUN ON UBUNTU
  # ==========================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        env:
          VITE_API_BASE_URL: ${{ inputs.api_url || secrets.VITE_API_BASE_URL }}
          VITE_POCKETBASE_URL: ${{ inputs.pocketbase_url || secrets.VITE_POCKETBASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${VITE_POCKETBASE_URL:-}" ]; then
            echo "::warning::VITE_POCKETBASE_URL not set in secrets! Android APK will use build fallback."
          fi
          npm run typecheck
          npm run build

      - name: Sync to Capacitor Android
        run: npx cap sync android

      - name: Build Android APK (Debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK File
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk app-latest.apk

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-latest-android-apk
          path: app-latest.apk
          retention-days: 14

      - name: Transfer APK to VPS via SCP
        if: ${{ env.VPS_HOST != '' && env.VPS_SSH_KEY != '' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
          username: ${{ vars.VPS_USERNAME || secrets.VPS_USERNAME || 'ubuntu' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ vars.VPS_SSH_PORT || secrets.VPS_SSH_PORT || vars.VPS_PORT || secrets.VPS_PORT || 22 }}
          source: 'app-latest.apk'
          target: ${{ vars.VPS_TARGET_DIR || secrets.VPS_TARGET_DIR || '/srv/www/life-planner/downloads' }}

  # ==========================================
  # 2. BUILD IOS (.IPA) - RUN ON MACOS CLOUD
  # ==========================================
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        env:
          VITE_API_BASE_URL: ${{ inputs.api_url || secrets.VITE_API_BASE_URL }}
          VITE_POCKETBASE_URL: ${{ inputs.pocketbase_url || secrets.VITE_POCKETBASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${VITE_POCKETBASE_URL:-}" ]; then
            echo "::warning::VITE_POCKETBASE_URL not set in secrets! iOS IPA will use build fallback."
          fi
          npm run typecheck
          npm run build

      - name: Sync to Capacitor iOS
        run: npx cap sync ios

      - name: Build iOS Archive (Unsigned)
        run: |
          mkdir -p build
          if [ -d "ios/App/App.xcworkspace" ]; then
            TARGET_FLAG="-workspace ios/App/App.xcworkspace"
          else
            TARGET_FLAG="-project ios/App/App.xcodeproj"
          fi
          xcodebuild $TARGET_FLAG \
                     -scheme App \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -archivePath build/App.xcarchive \
                     archive \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY=""

      - name: Package .xcarchive into .ipa
        run: |
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -r ../app-latest.ipa Payload

      - name: Upload IPA to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-latest-ios-ipa
          path: app-latest.ipa
          retention-days: 14

      - name: Transfer IPA to VPS via SCP
        if: ${{ env.VPS_HOST != '' && env.VPS_SSH_KEY != '' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
          username: ${{ vars.VPS_USERNAME || secrets.VPS_USERNAME || 'ubuntu' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ vars.VPS_SSH_PORT || secrets.VPS_SSH_PORT || vars.VPS_PORT || secrets.VPS_PORT || 22 }}
          source: 'app-latest.ipa'
          target: ${{ vars.VPS_TARGET_DIR || secrets.VPS_TARGET_DIR || '/srv/www/life-planner/downloads' }}
