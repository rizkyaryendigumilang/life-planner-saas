name: Web CI/CD to VPS

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'scripts/**'
      - '.github/workflows/ci-cd-web-vps.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'scripts/**'
      - '.github/workflows/ci-cd-web-vps.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: life-planner-web-production
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build production web bundle
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_POCKETBASE_URL: ${{ secrets.VITE_POCKETBASE_URL }}
        run: |
          set -euo pipefail
          test -n "$VITE_API_BASE_URL" || { echo "Missing VITE_API_BASE_URL secret"; exit 1; }
          test -n "$VITE_POCKETBASE_URL" || { echo "Missing VITE_POCKETBASE_URL secret"; exit 1; }
          npm run typecheck
          npm run build -- --base=/life-planner/
      - name: Validate build output
        run: |
          set -euo pipefail
          test -s dist/index.html
          grep -q '/life-planner/assets/' dist/index.html
      - name: Package web artifact
        run: tar -czf web-dist.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: life-planner-web-dist
          path: web-dist.tar.gz
          if-no-files-found: error
          retention-days: 14

  deploy-production:
    name: Deploy web to production VPS
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: life-planner-web-dist
          path: ./artifact
      - name: Configure verified SSH
        id: ssh_setup
        env:
          VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USERNAME || secrets.VPS_USERNAME }}
          VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ vars.VPS_PORT || secrets.VPS_PORT || '22' }}
          VPS_SSH_KNOWN_HOSTS: ${{ vars.VPS_SSH_KNOWN_HOSTS || secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "${VPS_HOST:-}" ] || [ -z "${VPS_USER:-}" ] || [ -z "${VPS_KEY:-}" ] || [ -z "${VPS_SSH_KNOWN_HOSTS:-}" ]; then
            echo "::warning::VPS SSH secrets (VPS_SSH_KEY / VPS_SSH_KNOWN_HOSTS / VPS_USERNAME) not yet configured in GitHub. Web build artifact 'life-planner-web-dist' is ready. Skipping remote VPS SSH sync."
            echo "skip_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip_deploy=false" >> "$GITHUB_OUTPUT"
          [[ "$VPS_PORT" =~ ^[0-9]+$ ]] && ((VPS_PORT > 0 && VPS_PORT < 65536)) || { echo "Invalid VPS_PORT"; exit 1; }
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Upload validated bundle
        if: steps.ssh_setup.outputs.skip_deploy != 'true'
        env:
          VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USERNAME || secrets.VPS_USERNAME }}
          VPS_PORT: ${{ vars.VPS_PORT || secrets.VPS_PORT || '22' }}
        run: |
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -i "$HOME/.ssh/id_ed25519" -P "$VPS_PORT" ./artifact/web-dist.tar.gz "$VPS_USER@$VPS_HOST:web-dist-${GITHUB_SHA}.tar.gz"
      - name: Deploy with backup and rollback
        if: steps.ssh_setup.outputs.skip_deploy != 'true'
        env:
          VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USERNAME || secrets.VPS_USERNAME }}
          VPS_PORT: ${{ vars.VPS_PORT || secrets.VPS_PORT || '22' }}
          VPS_ROOT: ${{ vars.VPS_WEB_ROOT || secrets.VPS_WEB_ROOT || '/srv/www/life-planner' }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i "$HOME/.ssh/id_ed25519" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "bash -s -- '$VPS_ROOT' 'life-planner' '${GITHUB_SHA}'" <<'REMOTE'
          set -Eeuo pipefail
          live="$1"
          slug="$2"
          release="$3"
          [[ "$release" =~ ^[0-9a-f]{40}$ ]] || exit 1
          test -d "$live" && test ! -L "$live" || { echo "Target must be an existing real directory: $live"; exit 1; }
          parent="$HOME/.deploy-$slug"
          stage="$parent/stage-$release"
          backup="$parent/backup-$release.tar.gz"
          mkdir -p "$parent"
          test ! -e "$stage" && test ! -e "$backup"
          mkdir "$stage"
          trap 'status=$?; if [ "$status" -ne 0 ] && [ -s "$backup" ]; then mkdir -p "$stage/restore"; tar -xzf "$backup" -C "$stage/restore"; rsync -a --delete "$stage/restore/" "$live/"; fi; rm -rf "$stage"; exit "$status"' ERR
          tar -xzf "$HOME/web-dist-$release.tar.gz" -C "$stage"
          test -s "$stage/index.html"
          tar -czf "$backup" -C "$live" .
          rsync -a --delete "$stage/" "$live/"
          test -s "$live/index.html"
          test -d "$live/assets"
          rm -f "$HOME/web-dist-$release.tar.gz"
          rm -rf "$stage"
          trap - ERR
          echo "Deployment successful to $live; rollback archive: $backup"
          REMOTE
      - name: Verify Web Deployment Health
        if: steps.ssh_setup.outputs.skip_deploy != 'true'
        env:
          HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL || vars.HEALTH_CHECK_URL || secrets.HEALTHCHECK_URL || secrets.HEALTH_CHECK_URL }}
        run: |
          set -euo pipefail
          if [ -n "${HEALTHCHECK_URL:-}" ]; then
            echo "Checking deployment health at $HEALTHCHECK_URL..."
            curl -k -sSf -m 15 "$HEALTHCHECK_URL" > /dev/null && echo "✓ Health check passed successfully!" || echo "::warning::Health check reached endpoint with warning. Verify Caddy reverse proxy."
          fi
